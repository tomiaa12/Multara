[package]
name = "multara"
version = "1.0.8"
description = "Local-first multi-agent development workspace"
authors = ["Multara"]
edition = "2021"
default-run = "multara"

[lib]
name = "multara"
path = "src/lib.rs"

[[bin]]
name = "multara"
path = "src/main.rs"

[[bin]]
name = "multara-cli"
path = "src/bin/multara_cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
cron = "0.17.0"
hmac = "0.13.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
# system-proxy：自动读 Windows/macOS 系统代理（Clash 等开「系统代理」即可，勿写死端口）
tauri-plugin-updater = { version = "2", default-features = true, features = ["system-proxy"] }
tauri-plugin-window-state = "2"
tempfile = "3.27.0"
tiny_http = "0.12.0"
toml = "1.1.5"
encoding_rs = "0.8"
notify = "8"
trash = "5"
portable-pty = "0.8"
regex = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
which = "8"
zstd = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSOpenPanel",
  "NSPanel",
  "NSResponder",
  "NSSavePanel",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSString",
  "NSURL",
] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
clipboard-win = "5"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
