      页面结构（模板、类名）变化时需要重新抓取快照。
      与 index.html（Playground）通过 postMessage 通信：

<p>保存文件时整理代码格式。</p></div><input class="ui-input ui-checkbox ds-switch" type="checkbox"></label><label class="settings-row"><div><strong>粘滞滚动</strong><p>滚动时置顶当前函数或标题。</p></div><input class="ui-input ui-checkbox ds-switch" type="checkbox" checked=""></label></section></div></div></div>
    </template>
    <script>
      (function () {
        // 侧栏链接 → 预览页 id；详情页高亮其所属的一级导航
        var ROUTES = {
          "#/projects": "dashboard", "#/inbox": "inbox", "#/tasks": "tasks", "#/automation": "automation",
          "#/agents": "agents", "#/squads": "squads", "#/stats": "stats", "#/runtimes": "runtimes",
          "#/skills": "skills", "#/mcp": "mcp", "#/settings": "settings",
        };
        var PARENT = { "task-detail": "tasks", "agent-detail": "agents" };
        var embedded = window.parent !== window;
        var shell = document.querySelector(".app-shell");
        var main = document.getElementById("pv-main");
        var title = document.querySelector(".titlebar-title strong");
        var current = "";

        function show(page) {
          var tpl = document.querySelector('template[data-page="' + page + '"]') || document.querySelector("template[data-page]");
          page = tpl.dataset.page;
          if (page === current) return;
          current = page;
          main.replaceChildren(tpl.content.cloneNode(true));
          if (title) title.textContent = tpl.dataset.title;
          var nav = PARENT[page] || page;
          document.querySelectorAll(".sidebar .nav-item[href]").forEach(function (link) {
            var active = ROUTES[link.getAttribute("href")] === nav;
            link.classList.toggle("router-link-active", active);
            link.classList.toggle("router-link-exact-active", active);
            if (active) link.setAttribute("aria-current", "page"); else link.removeAttribute("aria-current");
          });
          if (!embedded) history.replaceState(null, "", "#" + page);
        }

        function applyTheme(theme) {
          document.documentElement.dataset.theme = theme;
        }

        window.addEventListener("message", function (event) {
          var data = event.data || {};
          if (data.type !== "pg-state") return;
          // Playground 的 CSS 变量覆盖整体同步到预览根节点
          document.documentElement.style.cssText = data.cssText || "";
          applyTheme(data.theme || "dark");
          show(data.page || "dashboard");
        });

        document.addEventListener("click", function (event) {
          var target = event.target.closest("a, button");
          if (!target) return;
          if (target.matches(".titlebar-action")) {
            event.preventDefault();
            if (embedded) parent.postMessage({ type: "pg-toggle-theme" }, "*");
            else applyTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
            return;
          }
          if (target.matches(".sidebar-collapse")) {
            shell.classList.toggle("is-sidebar-collapsed");
            return;
          }
          if (target.tagName === "A") {
            event.preventDefault();
            var page = ROUTES[target.getAttribute("href")];
            if (!page) return;
            if (embedded) parent.postMessage({ type: "pg-page", page: page }, "*");
            else show(page);
          }
        });

        show(embedded ? "dashboard" : (location.hash.slice(1) || "dashboard"));
        if (!embedded) window.addEventListener("hashchange", () => show(location.hash.slice(1) || "dashboard"));
      })();
    </script>
